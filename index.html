<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Curiosity — Anesidora</title>
<style>
:root{--bg:#101014;--panel:#18181e;--text:#f3f3f5;--muted:#9b9ba6;--line:#2b2b34;--accent:#d8c8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:22px 18px 12px;position:sticky;top:0;background:rgba(16,16,20,.94);backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px;overflow:auto;padding:14px 0 2px}.toolbar button,.toolbar input,.toolbar select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px;font-size:13px}
.toolbar button.active{border-color:var(--accent);color:var(--accent)}
.toolbar input{min-width:180px;flex:1}
main{padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#555563}
.art{aspect-ratio:1;background:linear-gradient(135deg,#262632,#111117);display:grid;place-items:center;color:#555562;font-size:11px;text-align:center;padding:12px}
.info{padding:10px}.title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:999px;padding:3px 6px;margin-top:7px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
dialog{width:min(620px,94vw);border:1px solid var(--line);border-radius:18px;background:#15151b;color:var(--text);padding:0}
dialog::backdrop{background:rgba(0,0,0,.7)}.modal{padding:20px}.modal h2{margin:0 0 12px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#0f0f13;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}.field textarea{min-height:80px}
.row{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1px solid var(--line);background:#101014;color:var(--text);border-radius:999px;padding:8px 10px;font-size:12px}.choice.on{border-color:var(--accent);color:var(--accent)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.actions button{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}.actions .primary{background:var(--accent);color:#17131f;border-color:var(--accent)}
small.count{color:var(--muted);font-size:11px;margin-left:auto;align-self:center}
</style>
</head>
<body>
<header>
<h1>Music Curiosity</h1>
<div class="sub">A visual memory for the music that makes you stop scrolling.</div>
<div class="toolbar">
<input id="search" placeholder="Search your curiosity…">
<button data-filter="all" class="active">All</button>
<button data-filter="unheard">Unheard</button>
<button data-filter="heard">Heard</button>
<button data-filter="love">Love</button>
<button data-filter="obsession">Obsession</button>
<button id="add">＋ Save</button>
<button id="export">Export</button>
<small class="count" id="count"></small>
</div>
</header>
<main><div id="grid" class="grid"></div></main>

<dialog id="dlg">
<div class="modal">
<h2 id="dlgTitle">Save something</h2>
<div class="field"><label>YouTube Music URL</label><input id="url"></div>
<div class="field"><label>What kind of thing is this?</label>
<select id="type"><option value="album">Album / release</option><option value="artist">Artist</option><option value="mystery">I don't even know yet</option></select></div>
<div class="field"><label>Artist</label><input id="artist"></div>
<div class="field"><label>Album / title</label><input id="album"></div>
<div class="field"><label>Why did you save it?</label><div class="row" id="why">
<button class="choice" data-v="cover">🎨 The cover</button>
<button class="choice" data-v="artist">👤 The artist</button>
<button class="choice" data-v="related">🌀 Related artist</button>
<button class="choice" data-v="sound">👂 The sound</button>
<button class="choice" data-v="unknown">🤷 No idea</button>
</div></div>
<div class="field"><label>Tags — comma separated</label><input id="tags" placeholder="haunted, dreamy, weird…"></div>
<div class="field"><label>Notes</label><textarea id="notes" placeholder="Anything your future self should know…"></textarea></div>
<div class="field"><label>Status</label><select id="status"><option value="unheard">Unheard</option><option value="heard">Heard</option><option value="love">Love</option><option value="obsession">Obsession</option></select></div>
<div class="actions"><button id="cancel">Cancel</button><button class="primary" id="save">Save</button></div>
</div></dialog>

 $("grid").innerHTML=shown.map(x=>`
 <article class="card" data-id="${x.id}">
   <div class="art">${x.cover?`<img src="${x.cover}" style="width:100%;height:100%;object-fit:cover">`:"Artwork<br>will appear here"}</div>
   <div class="info"><div class="title">${esc(x.album||x.title||"Untitled")}</div>
   <div class="meta">${esc(x.artist||"Artist not identified")}</div>
   <span class="pill">${x.status}</span></div>
 </article>`).join("")||'<div class="empty">Nothing here yet.<br>Save something that makes your brain go “oooooh.”</div>';
 document.querySelectorAll(".card").forEach(c=>c.onclick=()=>openEdit(+c.dataset.id));
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function clearForm(){["url","artist","album","tags","notes"].forEach(id=>$(id).value="");$("type").value="album";$("status").value="unheard";selectedWhy=[];document.querySelectorAll(".choice").forEach(b=>b.classList.remove("on"))}
function openNew(){editing=null;clearForm();$("dlgTitle").textContent="Save something";$("dlg").showModal()}
function openEdit(id){editing=id;let x=items.find(a=>a.id===id);$("dlgTitle").textContent="Edit discovery";$("url").value=x.url||"";$("artist").value=x.artist||"";$("album").value=x.album||x.title||"";$("type").value=x.type||"album";$("status").value=x.status||"unheard";$("tags").value=(x.tags||[]).join(", ");$("notes").value=x.notes||"";selectedWhy=x.why||[];document.querySelectorAll(".choice").forEach(b=>b.classList.toggle("on",selectedWhy.includes(b.dataset.v)));$("dlg").showModal()}
$("add").onclick=openNew;$("cancel").onclick=()=>$("dlg").close();$("search").oninput=render;
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(z=>z.classList.remove("active"));b.classList.add("active");render()});
document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{let v=b.dataset.v;selectedWhy=selectedWhy.includes(v)?selectedWhy.filter(x=>x!==v):[...selectedWhy,v];b.classList.toggle("on")});
$("save").onclick=()=>{
 let x=editing?items.find(a=>a.id===editing):{id:Date.now(),created:new Date().toISOString()};
 x.url=$("url").value.trim();x.type=$("type").value;x.artist=$("artist").value.trim();x.album=$("album").value.trim();x.title=x.album||x.artist||"Discovery";x.status=$("status").value;x.why=selectedWhy;x.tags=$("tags").value.split(",").map(s=>s.trim()).filter(Boolean);x.notes=$("notes").value.trim();
 if(!editing)items.unshift(x);saveAll();$("dlg").close();render();
};
$("export").onclick=()=>{let blob=new Blob([JSON.stringify(items,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="music-curiosity.json";a.click();URL.revokeObjectURL(a.href)};
render();
</script>
</body>
</html>
